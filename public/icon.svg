<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#090B1A"/>
    </linearGradient>

    <!-- Green Monster Gradient -->
    <radialGradient id="greenGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="55%" stop-color="#20C997"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>

    <!-- Orange Monster Gradient -->
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>

    <!-- Purple Monster Gradient -->
    <radialGradient id="purpleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </radialGradient>

    <!-- Golden Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Stars in background -->
  <circle cx="88" cy="110" r="4" fill="#FFD43B" opacity="0.6"/>
  <circle cx="430" cy="130" r="5" fill="#FFD43B" opacity="0.7"/>
  <circle cx="395" cy="80" r="3" fill="#67E8F9" opacity="0.5"/>
  <circle cx="120" cy="210" r="3" fill="#F472B6" opacity="0.4"/>

  <!-- Left Orange Monster (Curious & Peeking) -->
  <g transform="translate(45, 230)">
    <!-- Body -->
    <circle cx="95" cy="150" r="85" fill="url(#orangeGrad)"/>
    <!-- Big funny round eyes -->
    <circle cx="70" cy="115" r="24" fill="#FFFFFF"/>
    <circle cx="118" cy="115" r="24" fill="#FFFFFF"/>
    <!-- Googly pupils looking up -->
    <circle cx="76" cy="106" r="11" fill="#111827"/>
    <circle cx="124" cy="106" r="11" fill="#111827"/>
    <circle cx="79" cy="103" r="4" fill="#FFFFFF"/>
    <circle cx="127" cy="103" r="4" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <ellipse cx="48" cy="145" rx="12" ry="7" fill="#EA580C" opacity="0.4"/>
    <ellipse cx="140" cy="145" rx="12" ry="7" fill="#EA580C" opacity="0.4"/>
    <!-- Cute open 'O' mouth -->
    <ellipse cx="94" cy="155" rx="10" ry="14" fill="#7C2D12"/>
    <ellipse cx="94" cy="161" rx="6" ry="6" fill="#F87171"/>
  </g>

  <!-- Right Purple Monster (Snoozing with closed arc eyes) -->
  <g transform="translate(295, 240)">
    <!-- Tiny horns/ears -->
    <path d="M40 70 Q30 30 65 55 Z" fill="#9333EA"/>
    <path d="M125 70 Q135 30 100 55 Z" fill="#9333EA"/>
    <!-- Body -->
    <circle cx="85" cy="140" r="80" fill="url(#purpleGrad)"/>
    <!-- Sleepy curved eyes -->
    <path d="M50 120 Q65 135 80 120" stroke="#3B0764" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M98 120 Q113 135 128 120" stroke="#3B0764" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <ellipse cx="44" cy="138" rx="10" ry="6" fill="#E879F9" opacity="0.5"/>
    <ellipse cx="132" cy="138" rx="10" ry="6" fill="#E879F9" opacity="0.5"/>
    <!-- Little smile -->
    <path d="M82 145 Q89 152 96 145" stroke="#3B0764" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Tiny Z snoring bubbles -->
    <text x="135" y="70" font-family="Rubik, sans-serif" font-size="24" font-weight="800" fill="#E879F9" opacity="0.8">z</text>
    <text x="152" y="45" font-family="Rubik, sans-serif" font-size="18" font-weight="800" fill="#E879F9" opacity="0.6">z</text>
  </g>

  <!-- Main Center Green Monster (Bouncy, Smiling Hero!) -->
  <g transform="translate(146, 120)">
    <!-- Cute round ears -->
    <circle cx="36" cy="48" r="28" fill="#14B8A6"/>
    <circle cx="36" cy="48" r="16" fill="#A7F3D0"/>
    <circle cx="184" cy="48" r="28" fill="#14B8A6"/>
    <circle cx="184" cy="48" r="16" fill="#A7F3D0"/>

    <!-- Squishy bouncy body -->
    <ellipse cx="110" cy="148" rx="106" ry="102" fill="url(#greenGrad)"/>

    <!-- Soft highlight -->
    <ellipse cx="78" cy="85" rx="36" ry="18" transform="rotate(-25 78 85)" fill="#FFFFFF" opacity="0.25"/>

    <!-- Funny happy closed eyes (arched) -->
    <path d="M56 126 Q80 100 100 126" stroke="#042F2E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M120 126 Q140 100 164 126" stroke="#042F2E" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Cute eyelashes -->
    <line x1="56" y1="120" x2="48" y2="114" stroke="#042F2E" stroke-width="4" stroke-linecap="round"/>
    <line x1="164" y1="120" x2="172" y2="114" stroke="#042F2E" stroke-width="4" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <ellipse cx="45" cy="150" rx="15" ry="9" fill="#F43F5E" opacity="0.45"/>
    <ellipse cx="175" cy="150" rx="15" ry="9" fill="#F43F5E" opacity="0.45"/>

    <!-- Cheerful open happy mouth -->
    <path d="M85 146 Q110 192 135 146 Z" fill="#042F2E"/>
    <!-- Cute pink tongue -->
    <path d="M96 164 Q110 186 124 164 Q110 156 96 164 Z" fill="#FB7185"/>
  </g>

  <!-- Big Floating Golden Reward Star on top -->
  <g transform="translate(256, 75)" filter="url(#starGlow)">
    <path d="M0 -34 L9 -9 L34 -9 L14 6 L21 31 L0 16 L-21 31 L-14 6 L-34 -9 L-9 -9 Z" fill="#FFD43B"/>
    <circle cx="-5" cy="-7" r="4" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
